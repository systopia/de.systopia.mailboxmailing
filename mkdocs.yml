site_name: Mailbox Mailing
site_description: Converts e-mails sent to a mail box to CiviCRM mailings.
site_author: SYSTOPIA
repo_url: https://github.com/systopia/de.systopia.mailboxmailing

theme:
  name: material

nav:
  - Introduction: index.md
  - 'Configuration': configuration.md
  - 'Use': use.md
  - 'Example and Hints': example-hints.md

markdown_extensions:
  - attr_list
  - admonition
  - def_list
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tilde
  - pymdownx.betterem
  - pymdownx.mark

plugins:
  - search:
      lang: en
